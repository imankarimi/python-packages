name: Download Python Packages

on:
  workflow_dispatch:
    inputs:
      packages:
        description: "Package names, example: django djangorestframework pillow"
        required: true
        type: string

      python_version:
        description: "Python version"
        required: true
        default: "3.13"
        type: choice
        options:
          - "3.13"
          - "3.12"
          - "3.11"
          - "3.10"

jobs:
  download-packages:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Download packages
        run: |
          mkdir -p packages

          echo "${{ inputs.packages }}" > requirements.txt

          pip download \
            --only-binary=:all: \
            -r requirements.txt \
            -d packages

      - name: Commit downloaded packages
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add packages requirements.txt

          git commit -m "Add downloaded Python packages" || echo "No changes to commit"
          git push
