name: Download Heavy Python Packages

on:
  workflow_dispatch:
    inputs:
      packages:
        description: "Example: stable-baselines3 torch torchvision torchaudio"
        required: true
        type: string

      python_version:
        description: "Python version"
        required: true
        default: "3.11"
        type: choice
        options:
          - "3.12"
          - "3.11"
          - "3.10"

      os:
        description: "Target OS"
        required: true
        default: "windows-2022"
        type: choice
        options:
          - "windows-2022"
          - "ubuntu-latest"
          - "macos-latest"

jobs:
  download-packages:
    runs-on: ${{ inputs.os }}

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Download packages
        shell: bash
        run: |
          python -m pip install --upgrade pip
          mkdir -p packagehouse

          echo "${{ inputs.packages }}" | tr ' ' '\n' > requirements.txt

          pip download \
            -r requirements.txt \
            -d packagehouse

      - name: Compress packages
        shell: bash
        run: |
          tar -czf packages-${{ inputs.os }}-py${{ inputs.python_version }}.tar.gz packagehouse requirements.txt

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: packages-${{ inputs.os }}-py${{ inputs.python_version }}
          name: Packages ${{ inputs.os }} Python ${{ inputs.python_version }}
          files: packages-${{ inputs.os }}-py${{ inputs.python_version }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
